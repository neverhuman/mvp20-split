[package]
name = "redteam_audit_t11_probe"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "redteam_audit_t11_probe"
path = "src/main.rs"

[dependencies]
amphora-core = { path = "/home/ubuntu/amphora/build/mvp20-split/amphora-core" }
