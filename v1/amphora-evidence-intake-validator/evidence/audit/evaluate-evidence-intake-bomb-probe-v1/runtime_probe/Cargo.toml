[package]
name = "eiv-evaluate-evidence-intake-bomb-probe"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: NOT a member of the mvp20-split workspace. Nothing is added to,
# built into, or written inside the workspace by this probe; output is
# redirected to scratch by the runner.
[workspace]

# LIVE differential harness: links the real amphora-core and
# amphora-assurance-capabilities crates and calls their real public entry
# points (CandidateEnvelope::from_value, stable_hash,
# AssuranceCapability::new(...).evaluate(...) via the Capability trait). This
# is NOT a re-implementation and NOT a copy of the runtime logic.
[dependencies]
amphora-core = { path = "../../../../../amphora-core" }
amphora-assurance-capabilities = { path = "../../../../../amphora-assurance-capabilities" }
serde_json = { version = "1", features = ["float_roundtrip"] }
