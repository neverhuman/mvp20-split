[project]
name = "amphora-data-artifacts"
version = "0.11.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema[format-nongpl]>=4.25,<5",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1.16,<2",
    "amphora-contracts-commands",
    "amphora-contracts-core",
    "amphora-contracts-artifacts==0.2.0",
    "amphora-contracts-evidence==0.5.0",
    "amphora-contracts-research==0.2.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
amphora-artifacts = "amphora_data_artifacts.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_data_artifacts"]

[tool.amphora]
public-imports = ["amphora-contracts-research", "amphora-contracts-evidence", "amphora-contracts-commands", "amphora-contracts-core", "amphora-contracts-artifacts"]

[tool.uv.sources]
amphora-contracts-research = { path = "../../contracts/research", editable = true }
amphora-contracts-evidence = { path = "../../contracts/evidence", editable = true }
amphora-contracts-commands = { path = "../../contracts/commands", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-artifacts = { path = "../../contracts/artifacts", editable = true }
