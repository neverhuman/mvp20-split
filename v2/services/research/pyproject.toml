[project]
name = "amphora-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-contracts-core==0.1.0", "amphora-contracts-research==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_research"]

[tool.uv.sources]
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-research = { path = "../../contracts/research", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-research"]
