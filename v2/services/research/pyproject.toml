[project]
name = "amphora-research"
version = "0.5.0"
requires-python = ">=3.12,<3.13"
dependencies = ["uvicorn>=0.34,<1", "fastapi>=0.115,<1", "pydantic>=2.12,<3", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.16,<2", "amphora-contracts-core==0.1.0", "amphora-contracts-research==0.2.0"]

[project.scripts]
amphora-research = "amphora_research.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_research"]

[tool.uv.sources]
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-research = { path = "../../contracts/research", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-research"]
