[project]
name = "amphora-agent-planning"
version = "0.16.0"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-tool-protocol==0.2.0", "amphora-contracts-artifacts==0.2.0", "amphora-contracts-commands==0.2.0", "amphora-contracts-evidence==0.5.13", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.16,<2","pydantic>=2.12,<3", "amphora-contracts-core==0.1.0", "amphora-contracts-planning==0.6.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_agent_planning"]

[tool.uv.sources]
amphora-tool-protocol = { path = "../../sdk/tool_protocol", editable = true }
amphora-contracts-artifacts = { path = "../../contracts/artifacts", editable = true }
amphora-contracts-commands = { path = "../../contracts/commands", editable = true }
amphora-contracts-evidence = { path = "../../contracts/evidence", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-planning = { path = "../../contracts/planning", editable = true }

[tool.amphora]
public-imports = ["amphora-tool-protocol", "amphora-contracts-artifacts", "amphora-contracts-commands", "amphora-contracts-evidence", "amphora-contracts-core", "amphora-contracts-planning"]
