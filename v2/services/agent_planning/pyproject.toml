[project]
name = "amphora-agent-planning"
version = "0.102.1"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-contracts-topology-search==0.1.0", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "amphora-contracts-supervision==0.10.1", "amphora-contracts-campaigns==0.4.1", "amphora-contracts-representations==0.3.0", "amphora-contracts-tools==0.1.0", "amphora-contracts-graph-runtime==0.13.0", "amphora-contracts-research-views==0.1.0", "amphora-contracts-research==0.14.0", "amphora-contracts-knowledge==0.8.0", "amphora-tool-protocol==0.2.0", "amphora-contracts-artifacts==0.2.0", "amphora-contracts-commands==0.2.0", "amphora-contracts-evidence==0.5.13", "sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.16,<2","pydantic>=2.12,<3", "amphora-contracts-core==0.1.0", "amphora-contracts-planning==0.11.0"]

[project.scripts]
amphora-planning = "amphora_agent_planning.supervision_api.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_agent_planning"]

[tool.uv.sources]
amphora-contracts-topology-search = { path = "../../contracts/topology_search", editable = true }
amphora-contracts-supervision = { path = "../../contracts/supervision", editable = true }
amphora-contracts-campaigns = { path = "../../contracts/campaigns", editable = true }
amphora-contracts-representations = { path = "../../contracts/representations", editable = true }
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }
amphora-contracts-graph-runtime = { path = "../../contracts/graph_runtime", editable = true }
amphora-contracts-research-views = { path = "../../contracts/research_views", editable = true }
amphora-contracts-research = { path = "../../contracts/research", editable = true }
amphora-contracts-knowledge = { path = "../../contracts/knowledge", editable = true }
amphora-tool-protocol = { path = "../../sdk/tool_protocol", editable = true }
amphora-contracts-artifacts = { path = "../../contracts/artifacts", editable = true }
amphora-contracts-commands = { path = "../../contracts/commands", editable = true }
amphora-contracts-evidence = { path = "../../contracts/evidence", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-planning = { path = "../../contracts/planning", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-topology-search", "amphora-contracts-supervision", "amphora-contracts-campaigns", "amphora-contracts-representations", "amphora-contracts-tools", "amphora-contracts-graph-runtime", "amphora-contracts-research-views", "amphora-contracts-research", "amphora-contracts-knowledge", "amphora-tool-protocol", "amphora-contracts-artifacts", "amphora-contracts-commands", "amphora-contracts-evidence", "amphora-contracts-core", "amphora-contracts-planning"]
