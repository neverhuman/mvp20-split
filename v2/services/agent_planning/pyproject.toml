[project]
name = "amphora-agent-planning"
version = "0.5.0"
requires-python = ">=3.12,<3.13"
dependencies = ["sqlalchemy>=2,<3", "psycopg[binary]>=3,<4", "alembic>=1.16,<2","pydantic>=2.12,<3", "amphora-contracts-core==0.1.0", "amphora-contracts-planning==0.2.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_agent_planning"]

[tool.uv.sources]
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-planning = { path = "../../contracts/planning", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-planning"]
