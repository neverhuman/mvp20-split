[project]
name = "amphora-capability-registry"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "amphora-contracts-commands==0.2.0",
    "amphora-contracts-core==0.1.0",
    "amphora-contracts-tools==0.1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_capability_registry"]

[tool.uv.sources]
amphora-contracts-commands = { path = "../../contracts/commands", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-tools", "amphora-contracts-commands"]
