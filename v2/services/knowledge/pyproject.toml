[project]
name = "amphora-knowledge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-contracts-core==0.1.0", "amphora-contracts-knowledge==0.1.0", "amphora-contracts-evidence==0.5.0", "amphora-contracts-research==0.2.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_knowledge"]

[tool.uv.sources]
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-knowledge = { path = "../../contracts/knowledge", editable = true }
amphora-contracts-evidence = { path = "../../contracts/evidence", editable = true }
amphora-contracts-research = { path = "../../contracts/research", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-knowledge", "amphora-contracts-evidence", "amphora-contracts-research"]
