[project]
name = "amphora-foundation-verification"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "amphora-contracts-core==0.1.0",
    "amphora-contracts-evidence==0.1.0",
    "amphora-contracts-tools==0.1.0",
    "amphora-contracts-campaigns==0.4.1",
    "amphora-campaign-runtime==0.20.0",
    "pytest>=8,<9",
    "jsonschema[format-nongpl]>=4.23,<5",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pytest-cov>=6,<8",
    "amphora-contracts-commands",
    "amphora-contracts-runtime",
    "amphora-contracts-artifacts",
    "amphora-data-artifacts",
    "amphora-capability-registry",
    "amphora-tool-protocol",
    "amphora-numeric-affine",
    "amphora-sequence-statistics",
    "amphora-contracts-graph-runtime==0.11.0",
    "amphora-contracts-solver-fixture==0.1.0",
    "amphora-solver-retain==0.1.0",
    "amphora-solver-score==0.1.0",
    "amphora-solver-mutate==0.1.0",
    "amphora-solver-select==0.1.0",
    "amphora-solver-seed==0.1.0",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.uv.sources]
amphora-contracts-evidence = { path = "../contracts/evidence", editable = true }
amphora-contracts-core = { path = "../contracts/core", editable = true }
amphora-contracts-tools = { path = "../contracts/tools", editable = true }
amphora-contracts-campaigns = { path = "../contracts/campaigns", editable = true }
amphora-campaign-runtime = { path = "../services/campaign_runtime", editable = true }
amphora-contracts-commands = { path = "../contracts/commands", editable = true }
amphora-contracts-runtime = { path = "../contracts/runtime", editable = true }
amphora-contracts-artifacts = { path = "../contracts/artifacts", editable = true }
amphora-data-artifacts = { path = "../services/data_artifacts", editable = true }
amphora-capability-registry = { path = "../services/capability_registry", editable = true }
amphora-tool-protocol = { path = "../sdk/tool_protocol", editable = true }
amphora-numeric-affine = { path = "../tools/numeric_affine", editable = true }
amphora-sequence-statistics = { path = "../tools/sequence_statistics", editable = true }
amphora-contracts-graph-runtime = { path = "../contracts/graph_runtime", editable = true }
amphora-contracts-solver-fixture = { path = "../contracts/solver_fixture", editable = true }

amphora-solver-seed = { path = "../tools/solver_seed", editable = true }

amphora-solver-select = { path = "../tools/solver_select", editable = true }

amphora-solver-mutate = { path = "../tools/solver_mutate", editable = true }

amphora-solver-score = { path = "../tools/solver_score", editable = true }

amphora-solver-retain = { path = "../tools/solver_retain", editable = true }

[tool.pytest.ini_options]
markers = ["postgres: requires explicit local PostgreSQL fixture opt-in"]
testpaths = ["../services/data_artifacts/tests", "../contracts/runtime/tests", "../contracts/artifacts/tests", "../contracts/commands/tests", "../contracts/core/tests", "../contracts/tools/tests", "../contracts/campaigns/tests", "../services/campaign_runtime/tests", "tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
