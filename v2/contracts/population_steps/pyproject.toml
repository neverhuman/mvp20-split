[project]
name = "amphora-contracts-population-steps"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-population==0.5.0", "amphora-contracts-core==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_population_steps"]

[tool.amphora]
public-imports = ["amphora-contracts-population", "amphora-contracts-core"]

[tool.uv.sources]
amphora-contracts-population = { path = "../population", editable = true }
amphora-contracts-core = { path = "../core", editable = true }
