[project]
name = "amphora-contracts-campaign-curation"
version = "0.1.1"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-core==0.1.0", "amphora-contracts-commands==0.2.0", "amphora-contracts-graph-runtime==0.13.0", "amphora-contracts-knowledge==0.8.0", "amphora-contracts-research==0.14.0", "amphora-contracts-tools==0.1.0", "amphora-contracts-planning==0.13.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_campaign_curation"]

[tool.uv.sources]
amphora-contracts-core = { path = "../core", editable = true }
amphora-contracts-commands = { path = "../commands", editable = true }
amphora-contracts-graph-runtime = { path = "../graph_runtime", editable = true }
amphora-contracts-knowledge = { path = "../knowledge", editable = true }
amphora-contracts-research = { path = "../research", editable = true }
amphora-contracts-tools = { path = "../tools", editable = true }
amphora-contracts-planning = { path = "../planning", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-commands", "amphora-contracts-graph-runtime", "amphora-contracts-knowledge", "amphora-contracts-research", "amphora-contracts-tools", "amphora-contracts-planning"]
