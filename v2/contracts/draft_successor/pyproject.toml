[project]
name = "amphora-contracts-draft-successor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-contracts-commands==0.2.0", "amphora-contracts-graph-runtime==0.13.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_draft_successor"]

[tool.uv.sources]
amphora-contracts-commands = { path = "../commands", editable = true }
amphora-contracts-graph-runtime = { path = "../graph_runtime", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-commands", "amphora-contracts-graph-runtime"]
