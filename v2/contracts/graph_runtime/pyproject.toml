[project]
name = "amphora-contracts-graph-runtime"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-core==0.1.0", "amphora-contracts-campaigns==0.3.0", "amphora-contracts-runtime==0.1.0", "amphora-contracts-commands==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_graph_runtime"]

[tool.uv.sources]
amphora-contracts-core = { path = "../core", editable = true }
amphora-contracts-campaigns = { path = "../campaigns", editable = true }
amphora-contracts-runtime = { path = "../runtime", editable = true }
amphora-contracts-commands = { path = "../commands", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-campaigns", "amphora-contracts-runtime", "amphora-contracts-commands"]
