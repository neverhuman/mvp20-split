[project]
name = "amphora-contracts-research"
version = "0.11.0"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-contracts-artifacts==0.2.0", "amphora-contracts-graph-runtime==0.13.0", "pydantic>=2.12,<3", "amphora-contracts-core==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_research"]

[tool.uv.sources]
amphora-contracts-artifacts = { path = "../artifacts", editable = true }
amphora-contracts-graph-runtime = { path = "../graph_runtime", editable = true }
amphora-contracts-core = { path = "../core", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-artifacts", "amphora-contracts-graph-runtime", "amphora-contracts-core"]
