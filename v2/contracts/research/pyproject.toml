[project]
name = "amphora-contracts-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-core==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_research"]

[tool.uv.sources]
amphora-contracts-core = { path = "../core", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core"]
