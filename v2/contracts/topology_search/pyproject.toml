[project]
name = "amphora-contracts-topology-search"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-core==0.1.0", "amphora-contracts-tools==0.1.0", "amphora-contracts-campaigns==0.4.1", "amphora-contracts-graph-runtime==0.13.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_topology_search"]

[tool.uv.sources]
amphora-contracts-core = { path = "../core", editable = true }
amphora-contracts-tools = { path = "../tools", editable = true }
amphora-contracts-campaigns = { path = "../campaigns", editable = true }
amphora-contracts-graph-runtime = { path = "../graph_runtime", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-tools", "amphora-contracts-campaigns", "amphora-contracts-graph-runtime"]
