[project]
name = "amphora-contracts-campaign-resources"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-commands==0.2.0", "amphora-contracts-core==0.1.0", "amphora-contracts-graph-runtime==0.13.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_campaign_resources"]

[tool.uv.sources]
amphora-contracts-commands = { path = "../commands", editable = true }
amphora-contracts-core = { path = "../core", editable = true }
amphora-contracts-graph-runtime = { path = "../graph_runtime", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-commands", "amphora-contracts-core", "amphora-contracts-graph-runtime"]
