[project]
name = "amphora-contracts-artifact-retention"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-artifacts==0.2.0", "amphora-contracts-core==0.1.0", "amphora-contracts-commands==0.2.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_artifact_retention"]

[tool.uv.sources]
amphora-contracts-artifacts = { path = "../artifacts", editable = true }
amphora-contracts-core = { path = "../core", editable = true }
amphora-contracts-commands = { path = "../commands", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-artifacts", "amphora-contracts-core", "amphora-contracts-commands"]
