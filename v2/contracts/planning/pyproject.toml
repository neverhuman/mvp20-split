[project]
name = "amphora-contracts-planning"
version = "0.8.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-core==0.1.0", "amphora-contracts-graph-runtime==0.13.0", "amphora-contracts-knowledge==0.8.0", "amphora-contracts-evidence==0.5.13", "amphora-contracts-research==0.14.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_planning"]

[tool.uv.sources]
amphora-contracts-knowledge = { path = "../knowledge", editable = true }
amphora-contracts-evidence = { path = "../evidence", editable = true }
amphora-contracts-research = { path = "../research", editable = true }
amphora-contracts-core = { path = "../core", editable = true }
amphora-contracts-graph-runtime = { path = "../graph_runtime", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-graph-runtime", "amphora-contracts-knowledge", "amphora-contracts-evidence", "amphora-contracts-research"]
