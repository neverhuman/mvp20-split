[project]
name = "amphora-contracts-knowledge"
version = "0.6.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-core==0.1.0", "amphora-contracts-evidence==0.5.0", "amphora-contracts-research==0.2.0", "amphora-contracts-artifacts==0.2.0", "amphora-contracts-graph-runtime==0.11.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_contracts_knowledge"]

[tool.uv.sources]
amphora-contracts-artifacts = { path = "../artifacts", editable = true }
amphora-contracts-graph-runtime = { path = "../graph_runtime", editable = true }
amphora-contracts-core = { path = "../core", editable = true }
amphora-contracts-evidence = { path = "../evidence", editable = true }
amphora-contracts-research = { path = "../research", editable = true }

[tool.amphora]
public-imports = ["amphora-contracts-core", "amphora-contracts-evidence", "amphora-contracts-research", "amphora-contracts-artifacts", "amphora-contracts-graph-runtime"]
