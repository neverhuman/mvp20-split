[project]
name = "amphora-tool-protocol"
version = "0.4.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "amphora-contracts-core",
    "amphora-contracts-commands",
    "amphora-contracts-runtime",
    "amphora-contracts-artifacts==0.2.0",
    "amphora-contracts-tools",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_tool_protocol"]

[tool.amphora]
public-client = true
public-imports = ["amphora-contracts-core", "amphora-contracts-commands", "amphora-contracts-runtime", "amphora-contracts-artifacts", "amphora-contracts-tools"]

[tool.uv.sources]
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-commands = { path = "../../contracts/commands", editable = true }
amphora-contracts-runtime = { path = "../../contracts/runtime", editable = true }
amphora-contracts-artifacts = { path = "../../contracts/artifacts", editable = true }
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }
