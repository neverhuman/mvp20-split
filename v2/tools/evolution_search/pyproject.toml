[project]
name = "amphora-evolution-search"
version = "0.4.0"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-contracts-tools==0.1.0", "amphora-tool-protocol==0.2.0", "amphora-contracts-graph-runtime==0.13.0", "amphora-contracts-core==0.1.0", "amphora-contracts-search-steps==0.1.0", "amphora-contracts-search==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_evolution_search"]

[tool.amphora]
public-imports = ["amphora-contracts-tools", "amphora-tool-protocol", "amphora-contracts-graph-runtime", "amphora-contracts-core", "amphora-contracts-search-steps", "amphora-contracts-search"]

[tool.uv.sources]
amphora-tool-protocol = { path = "../../sdk/tool_protocol", editable = true }
amphora-contracts-search-steps = { path = "../../contracts/search_steps", editable = true }
amphora-contracts-search = { path = "../../contracts/search", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }

[project.scripts]
amphora-numeric-search = "amphora_evolution_search.__main__:main"
