[project]
name = "amphora-evolution-search"
version = "0.17.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-campaigns==0.4.1", "amphora-contracts-node-inputs==0.1.0", "amphora-contracts-execution-proofs==0.1.0", "amphora-contracts-runtime==0.1.0", "amphora-contracts-artifacts==0.2.0", "amphora-contracts-population-steps==0.1.0", "amphora-contracts-population==0.5.0", "amphora-contracts-tools==0.1.0", "amphora-tool-protocol==0.4.0", "amphora-contracts-graph-runtime==0.13.0", "amphora-contracts-core==0.1.0", "amphora-contracts-search-steps==0.1.0", "amphora-contracts-search==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_evolution_search"]

[tool.amphora]
public-imports = ["amphora-contracts-campaigns", "amphora-contracts-node-inputs", "amphora-contracts-execution-proofs", "amphora-contracts-runtime", "amphora-contracts-artifacts", "amphora-contracts-population-steps", "amphora-contracts-population", "amphora-contracts-tools", "amphora-tool-protocol", "amphora-contracts-graph-runtime", "amphora-contracts-core", "amphora-contracts-search-steps", "amphora-contracts-search"]

[tool.uv.sources]
amphora-contracts-campaigns = { path = "../../contracts/campaigns", editable = true }
amphora-contracts-node-inputs = { path = "../../contracts/node_inputs", editable = true }
amphora-contracts-execution-proofs = { path = "../../contracts/execution_proofs", editable = true }
amphora-contracts-runtime = { path = "../../contracts/runtime", editable = true }
amphora-contracts-artifacts = { path = "../../contracts/artifacts", editable = true }
amphora-contracts-population-steps = { path = "../../contracts/population_steps", editable = true }
amphora-contracts-population = { path = "../../contracts/population", editable = true }
amphora-tool-protocol = { path = "../../sdk/tool_protocol", editable = true }
amphora-contracts-search-steps = { path = "../../contracts/search_steps", editable = true }
amphora-contracts-search = { path = "../../contracts/search", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }

[project.scripts]
amphora-numeric-search = "amphora_evolution_search.__main__:main"
