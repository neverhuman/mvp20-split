[project]
name = "amphora-chemical-structure"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["rdkit==2025.9.6", "amphora-contracts-chemical-structure==0.1.0", "pydantic>=2.11,<3", "amphora-contracts-core", "amphora-contracts-tools", "amphora-tool-protocol"]

[project.scripts]
amphora-chemical-structure = "amphora_chemical_structure.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_chemical_structure"]

[tool.amphora]
public-imports = ["amphora-contracts-chemical-structure", "amphora-contracts-core", "amphora-contracts-tools", "amphora-tool-protocol"]

[tool.uv.sources]
amphora-contracts-chemical-structure = { path = "../../contracts/chemical_structure", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }
amphora-tool-protocol = { path = "../../sdk/tool_protocol", editable = true }
