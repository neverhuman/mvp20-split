[project]
name = "amphora-process-mapping"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3", "amphora-contracts-population==0.5.0", "amphora-contracts-core==0.1.0", "amphora-contracts-artifacts==0.2.0", "amphora-contracts-runtime==0.1.0", "amphora-contracts-tools==0.1.0", "amphora-tool-protocol==0.4.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_process_mapping"]

[tool.amphora]
public-imports = ["amphora-contracts-population", "amphora-contracts-core", "amphora-contracts-artifacts", "amphora-contracts-runtime", "amphora-contracts-tools", "amphora-tool-protocol"]

[tool.uv.sources]
amphora-contracts-population = { path = "../../contracts/population", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-artifacts = { path = "../../contracts/artifacts", editable = true }
amphora-contracts-runtime = { path = "../../contracts/runtime", editable = true }
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }
amphora-tool-protocol = { path = "../../sdk/tool_protocol", editable = true }

[project.scripts]
amphora-process-mapping = "amphora_process_mapping.__main__:main"
