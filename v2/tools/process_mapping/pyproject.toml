[project]
name = "amphora-process-mapping"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-contracts-population==0.4.0", "amphora-contracts-core==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_process_mapping"]

[tool.amphora]
public-imports = ["amphora-contracts-population", "amphora-contracts-core"]

[tool.uv.sources]
amphora-contracts-population = { path = "../../contracts/population", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
