[project]
name = "amphora-solver-mutate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.11,<3", "amphora-contracts-core", "amphora-contracts-tools", "amphora-tool-protocol", "amphora-contracts-solver-fixture==0.1.0"]

[project.scripts]
amphora-solver-mutate = "amphora_solver_mutate.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_solver_mutate"]

[tool.amphora]
public-imports = ["amphora-contracts-solver-fixture", "amphora-contracts-core", "amphora-contracts-tools", "amphora-tool-protocol"]

[tool.uv.sources]
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }
amphora-tool-protocol = { path = "../../sdk/tool_protocol", editable = true }

amphora-contracts-solver-fixture = { path = "../../contracts/solver_fixture", editable = true }
