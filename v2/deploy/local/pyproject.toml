[project]
name = "amphora-deployment"
version = "0.17.0"
requires-python = ">=3.12,<3.13"
dependencies = ["amphora-contracts-campaign-launch==0.1.0", "amphora-contracts-commands==0.2.0", "amphora-contracts-core==0.1.0", "amphora-contracts-runtime==0.1.0", "amphora-contracts-graph-runtime==0.13.0", "amphora-contracts-tools==0.1.0"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amphora_deployment"]

[tool.amphora]
public-imports = ["amphora-contracts-campaign-launch", "amphora-contracts-commands", "amphora-contracts-core", "amphora-contracts-runtime", "amphora-contracts-graph-runtime", "amphora-contracts-tools"]

[tool.uv.sources]
amphora-contracts-tools = { path = "../../contracts/tools", editable = true }
amphora-contracts-graph-runtime = { path = "../../contracts/graph_runtime", editable = true }
amphora-contracts-campaign-launch = { path = "../../contracts/campaign_launch", editable = true }
amphora-contracts-commands = { path = "../../contracts/commands", editable = true }
amphora-contracts-core = { path = "../../contracts/core", editable = true }
amphora-contracts-runtime = { path = "../../contracts/runtime", editable = true }
