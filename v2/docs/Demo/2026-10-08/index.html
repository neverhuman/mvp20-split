9789094ec4443ed4db0f85"}];let index=0;function show(){const s=slides[index];document.getElementById('title').textContent=s.title;document.getElementById('caption').textContent=s.caption;const image=document.getElementById('screen');image.src=s.image;image.alt=s.title+' | screenshot from real local services, not live execution';document.getElementById('position').textContent=(index+1)+' of '+slides.length;document.getElementById('previous').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;document.getElementById('full').href=s.image;}document.getElementById('previous').onclick=()=>{if(index>0){index--;show()}};document.getElementById('next').onclick=()=>{if(index<slides.length-1){index++;show()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('previous').click()});show();</script></html>
